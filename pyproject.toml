[build-system]
requires = ["hatchling>=1.31.0"]
build-backend = "hatchling.build"

[project]
name = "authorstyle"
version = "0.1.0"
description = "Local-first research CLI for learning and reproducing personal writing style from a user's corpus."
readme = "README.md"
requires-python = ">=3.11"
license = "MIT"
authors = [{ name = "Fernando Paladini" }]
keywords = ["stylometry", "writing-style", "local-first", "cli", "llm"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Environment :: Console",
  "Intended Audience :: Developers",
  "Intended Audience :: Science/Research",
  "License :: OSI Approved :: MIT License",
  "Operating System :: OS Independent",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Scientific/Engineering :: Artificial Intelligence",
  "Topic :: Text Processing :: Linguistic",
]
dependencies = [
  "beautifulsoup4>=4.15.0",
  "httpx>=0.27",
  "numpy>=1.26",
  "pydantic>=2.7",
  "python-docx>=1.1",
  "pyyaml>=6.0",
  "rich>=15.0.0",
  "scikit-learn>=1.4",
  "scipy>=1.12",
  "typer>=0.12",
]

[project.optional-dependencies]
embeddings = ["sentence-transformers>=5.7.0"]
nlp = ["spacy>=3.7"]
dev = ["pytest>=8.2", "ruff>=0.16.2"]

[project.scripts]
authorstyle = "authorstyle.cli.app:app"

[project.urls]
Homepage = "https://github.com/paladini/authorstyle"
Repository = "https://github.com/paladini/authorstyle"
Issues = "https://github.com/paladini/authorstyle/issues"
Documentation = "https://github.com/paladini/authorstyle/blob/main/docs/architecture.md"
Changelog = "https://github.com/paladini/authorstyle/blob/main/CHANGELOG.md"

[tool.hatch.build.targets.wheel]
packages = ["src/authorstyle"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
